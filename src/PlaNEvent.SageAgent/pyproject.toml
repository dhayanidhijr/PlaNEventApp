[project]
name = "planevent-sage-agent"
version = "0.1.0"
description = "Strands-based Sage AI agent for PlaNEvent running on Amazon Bedrock AgentCore Runtime."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bedrock-agentcore>=0.1.0",
    "httpx>=0.27.0",
    "strands-agents>=1.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
